databases:
  - name: borla-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: borla
    runtime: node
    plan: free
    # --include=dev is required here: NODE_ENV=production below makes npm default to
    # omitting devDependencies (vite, typescript, tsx) during `npm ci`, which are exactly what
    # the build step needs — only the *runtime* should skip them, not the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: borla-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GIANTSMS_API_TOKEN
        sync: false
      - key: GIANTSMS_SENDER_ID
        sync: false
      - key: REDIS_URL
        sync: false
