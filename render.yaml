# borla-db (Render's own free managed Postgres) is no longer bound to DATABASE_URL below --
# Borla now runs on a dedicated Supabase project instead (kept separate from the live
# farmconnect-ghana project's database; PostGIS enabled, migrations + demo seed already applied).
# This block is left in place, not deleted, so the old database resource isn't destroyed by a
# Blueprint sync -- it's just unused now. Safe to remove yourself once you're sure nothing on it
# is still needed; not done here since deleting a database isn't this change's call to make.
databases:
  - name: borla-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: borla
    runtime: node
    plan: free
    # --include=dev is required here: NODE_ENV=production below makes npm default to
    # omitting devDependencies (vite, typescript, tsx) during `npm ci`, which are exactly what
    # the build step needs — only the *runtime* should skip them, not the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Points at a dedicated Supabase project (not the old borla-db above) -- paste the real
      # connection string in Render's dashboard, same as GEMINI_API_KEY/GIANTSMS_* below. Use the
      # pooler connection string (port 5432 or 6543, host ending in pooler.supabase.com), not the
      # direct-connection one.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GIANTSMS_API_TOKEN
        sync: false
      - key: GIANTSMS_SENDER_ID
        sync: false
      - key: REDIS_URL
        sync: false
      # Web Push (VAPID) — not generateValue:true like the JWT secrets above: these need to be a
      # real EC P-256 keypair (web-push's own generateVAPIDKeys(), not an arbitrary random
      # string), so they're supplied the same way GIANTSMS/GEMINI are.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
