databases:
  - name: borla-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: borla
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: borla-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
